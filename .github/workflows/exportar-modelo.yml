name: Preparar detector YOLOv8 para web

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/exportar-modelo.yml'

permissions:
  contents: write

jobs:
  exportar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar conversor
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'ultralytics==8.4.175' 'onnx>=1.17,<2'
      - name: Baixar modelo treinado
        run: |
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/letyresina/auditoria-calcadas-yolov8/main/models/best.pt' --output /tmp/calcadas.pt
      - name: Exportar para ONNX
        run: |
          python - <<'PY'
          from pathlib import Path
          from ultralytics import YOLO
          model = YOLO('/tmp/calcadas.pt')
          generated = model.export(format='onnx', imgsz=512, opset=12, simplify=False, dynamic=False, nms=False)
          output = Path('public/models/calcadas.onnx')
          output.parent.mkdir(parents=True,exist_ok=True)
          output.write_bytes(Path(generated).read_bytes())
          print(output, output.stat().st_size)
          PY
      - name: Baixar exemplos publicos do conjunto de teste
        run: |
          mkdir -p public/exemplos
          BASE='https://raw.githubusercontent.com/letyresina/auditoria-calcadas-yolov8/main/dataset/test/images'
          curl --fail --location --retry 3 "$BASE/1027648026455965_jpg.rf.0c74ebcad0025a089ed1113df0388e0d.jpg" -o public/exemplos/piso-tatil.jpg
          curl --fail --location --retry 3 "$BASE/imagem_2026-10-09_192502543_png.rf.2b2fb8295fdb95f645eaf477c1a03042.jpg" -o public/exemplos/desnivel.jpg
      - name: Publicar modelo e exemplos
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/models/calcadas.onnx public/exemplos/*.jpg
          if ! git diff --cached --quiet; then
            git commit -m 'Publica modelo de detecção em ONNX'
            git push origin HEAD:main
          fi
