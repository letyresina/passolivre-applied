name: Preparar detector YOLOv8 para web

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/exportar-modelo.yml'

permissions:
  contents: write

jobs:
  exportar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar conversor
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'ultralytics==8.4.175' 'onnx>=1.17,<2'
      - name: Baixar modelo treinado
        run: |
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/letyresina/auditoria-calcadas-yolov8/main/models/best.pt' --output /tmp/calcadas.pt
      - name: Exportar para ONNX
        run: |
          python - <<'PY'
          from pathlib import Path
          from ultralytics import YOLO
          model = YOLO('/tmp/calcadas.pt')
          generated = model.export(format='onnx', imgsz=512, opset=12, simplify=False, dynamic=False, nms=False)
          output = Path('public/models/calcadas.onnx')
          output.parent.mkdir(parents=True,exist_ok=True)
          output.write_bytes(Path(generated).read_bytes())
          print(output, output.stat().st_size)
          PY
      - name: Publicar modelo
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/models/calcadas.onnx
          if ! git diff --cached --quiet; then
            git commit -m 'Publica modelo de detecção em ONNX'
            git push origin HEAD:main
          fi
